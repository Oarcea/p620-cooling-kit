# lm-sensors labels for Lenovo ThinkStation P620 (NCT6686D via out-of-tree nct6687 driver)
# Fan mapping identified 2026-11-16 by pulsing each PWM channel.
# Install: sudo cp p620-nct6686.conf /etc/sensors.d/
#
#   pwm1 -> fan1 + fan2  CPU cooler (two fans, one channel)
#   pwm2 -> nothing seen, no tach
#   pwm3 -> fan3         PSU fan (also the SMBIOS "Power Supply Fan")
#   pwm4 -> fan4         Front-panel fan header — user-added front fan (~12800 RPM max).
#                        ODD_FAN header: NOT on any of pwm1-8 (all tested with a fan plugged in) and no tach
#                        on fan1-8 — it runs at full speed all the time, not controllable from Linux.
#                        With nothing plugged in the firmware runs pwm4 at 100% (no tach = stall fallback).
#   pwm5 -> fan5         rear fan
#   pwm6 -> fan6         DIMM1 header — 2x 40 mm fans (Y-splitter) on P100-1 (verified 18 Nov 2026) (~1,330 RPM floor, ~16,000 max)
#   pwm7 -> fan7         DIMM2 header — 2x 40 mm fans (Y-splitter) on P100-2 (verified 18 Nov 2026) (~1,330 RPM floor, ~16,000 max)
#   pwm8 -> nothing seen, no tach

chip "nct6686-isa-*"
    label fan1 "CPU fan A"
    label fan2 "CPU fan B"
    label fan3 "PSU fan"
    label fan4 "Front panel fan"
    label fan5 "Rear fan"
    label fan6 "P100-1 fans (DIMM1)"
    label fan7 "P100-2 fans (DIMM2)"
    ignore fan8

    # Voltage inputs use MSI scaling and read wrong on this board (+12V shows ~7.6 V) — hide them.
    ignore in0
    ignore in1
    ignore in2
    ignore in3
    ignore in4
    ignore in5
    ignore in6
    ignore in7
    ignore in8
    ignore in9
    ignore in10
    ignore in11
    ignore in12
    ignore in13

    # temp2 ("System") reads about -2 °C: not a real sensor here.
    ignore temp2
